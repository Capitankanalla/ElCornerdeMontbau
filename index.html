<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <meta name="description" content="" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Gloria+Hallelujah&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/hero.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/home.css" />
</head>

<body>

  <div id="header-mount"></div>

  <main>
    <!-- HERO -->
    <section class="hero">
      <div class="hero-image">
        <img id="hero-image" src="imgs/hero.webp" alt="">
        <img id="hero-image-next" alt="" aria-hidden="true">
      </div>

      <div class="container hero-content">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 class="hero-title"></h1>
        <p class="hero-sub"></p>
        <div class="hero-columns" id="hero-columns"></div>

        <div class="hero-actions">
          <a href="html/menu-dia.html" class="btn btn-primary" id="hero-menu-link"></a>
          <a href="html/carta.html" class="btn btn-secondary" id="hero-carta-link"></a>
        </div>
      </div>

      <div class="hero-scroll-hint">
        <span id="discover-label"></span>
        <span class="line"></span>
      </div>
    </section>
    <div class="grate-divider"></div>

    <!-- LOS CLÁSICOS -->
    <section class="section" id="clasicos">
      <div class="container">
        <div class="section-head reveal">
          <div>
            <p class="eyebrow" id="classics-eyebrow"></p>
            <h2 id="classics-title"></h2>
          </div>
          <p class="lead" id="classics-lead"></p>
        </div>
        <div class="classics-grid" id="classics-mount"></div>
      </div>
    </section>

    <!-- SOBRE NOSOTROS -->
    <section class="section section-compact" id="nosotros">
      <div class="container about-grid reveal">
        <div>
            <p class="eyebrow" id="about-eyebrow"></p>
            <h2 id="about-title"></h2>
        </div>
        <div class="about-text" id="about-mount"></div>
      </div>
    </section>

    <!-- INFO STRIP -->
    <section class="section-compact" id="localizacion">
      <div class="container">
        <div class="info-strip reveal">
          <div class="info-item">
            <p class="eyebrow" id="hours-label"></p>
            <p id="schedule-mount"></p>
          </div>
          <div class="info-item">
            <p class="eyebrow" id="location-label"></p>
            <p id="address-mount"></p>
          </div>
          <div class="info-item">
            <p class="eyebrow" id="reservations-label"></p>
            <p id="phone-mount"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- CONTACTO -->
    <section class="section" id="contacto">
      <div class="container contact-box reveal">
        <div>
          <p class="eyebrow" id="contact-eyebrow"></p>
          <h2 id="contact-title"></h2>
          <p class="lead" id="contact-text"></p>
        </div>
        <div class="hero-actions">
          <a href="#" id="phone-cta" class="btn btn-primary"></a>
          <a href="carta.html" id="contact-menu-link" class="btn btn-secondary"></a>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-mount"></div>

  <script src="js/content.js"></script>
  <script src="data/carta-data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/home.js"></script>
</body>

</html>
