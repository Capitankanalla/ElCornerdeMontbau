<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <title>El Córner de Montbau — ¿Qué te apetece hoy?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

    <a href="index.html" style="font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--color-stone); text-transform: uppercase; letter-spacing: 0.08em;">Conocer el restaurante →</a>
