<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
</head>
<body>
  <main class="qr-select">
    <div class="logo" id="qr-logo"></div>
    <p class="eyebrow"><span class="ember-dot"></span> <span id="qr-eyebrow"></span></p>
    <h1 id="qr-title" style="margin:0"></h1>

    <div class="qr-choices">
      <a href="menu-dia.html" class="qr-choice">
        <span class="icon" id="daily-menu-icon"></span>
        <h3 id="qr-daily-menu"></h3>
        <p id="qr-daily-menu-description" style="margin:0; font-size: var(--fs-sm); color: var(--color-stone)"></p>
      </a>
      <a href="carta.html" class="qr-choice">
        <span class="icon" id="carta-icon"></span>
        <h3 id="qr-carta"></h3>
        <p id="qr-carta-description" style="margin:0; font-size: var(--fs-sm); color: var(--color-stone)"></p>
      </a>
    </div>

    <a href="index.html" id="qr-restaurant" style="font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--color-stone); text-transform: uppercase; letter-spacing: 0.08em;"></a>
  </main>
  <script src="../js/content.js"></script>
  <script src="../js/qr.js"></script>
</body>
</html>
